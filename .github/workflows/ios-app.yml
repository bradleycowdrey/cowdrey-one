name: iPhone app

# Builds, signs and uploads to TestFlight only; it never creates or submits an App Store version.
# Needs an app record with bundle ID com.bradcowdrey.cowdreyone in App Store Connect (Apps, +, New App).

on:
  push:
    branches: [main]
    # Build a new iPhone and iPad version when the version number, the Rust code or this workflow changes.
    paths:
      - desktop/src-tauri/tauri.conf.json
      - desktop/src-tauri/Cargo.toml
      - desktop/src-tauri/src/**
      - desktop/src-tauri/capabilities/**
      - desktop/src-tauri/plugins/**
      - desktop/src-tauri/icons/**
      - .github/workflows/ios-app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Build Cowdrey One for iPhone and iPad
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      # The App Store Connect API key the other apps use (Users and Access, Integrations, Admin access). With it,
      # Xcode makes the Apple Distribution certificate and App Store profile itself, and the build goes to TestFlight.
      APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      HAS_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install the Tauri command line tools
        working-directory: desktop
        run: npm ci

      - name: Bundle the web app
        working-directory: desktop
        run: node build.mjs

      # Without the API key, only prove the iOS code compiles: nothing is signed or uploaded.
      - name: Compile for iOS (no App Store key yet)
        if: env.HAS_KEY == 'false'
        working-directory: desktop/src-tauri
        run: cargo build --release --lib --target aarch64-apple-ios

      # Signs a short-lived token and checks the key, the bundle ID and the app record, so a wrong key, a key without
      # Admin access or a missing app record stops here with a clear message. The bundle ID is registered if it isn't
      # yet, so "Cowdrey One" can be picked when creating the app record in App Store Connect.
      - name: Check the App Store Connect key, bundle ID and app record
        if: env.HAS_KEY == 'true'
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, sys, time, json, urllib.request, urllib.error, jwt
          BUNDLE = "com.bradcowdrey.cowdreyone"
          p8 = os.environ["P8"].replace("\r", "").strip()
          try:
              tok = jwt.encode({"iss": os.environ["APPLE_API_ISSUER"].strip(), "iat": int(time.time()), "exp": int(time.time()) + 600,
                                "aud": "appstoreconnect-v1"}, p8, algorithm="ES256", headers={"kid": os.environ["APPLE_API_KEY"].strip(), "typ": "JWT"})
          except Exception as e:
              sys.exit("The APP_STORE_CONNECT_API_KEY secret is not a valid .p8 private key: %s" % e)
          def call(method, path, body=None):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1" + path, method=method,
                                           data=json.dumps(body).encode() if body else None,
                                           headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  text = e.read().decode(errors="replace")
                  try: text = "; ".join("%s: %s" % (x.get("title"), x.get("detail")) for x in json.loads(text)["errors"])
                  except Exception: pass
                  sys.exit("App Store Connect refused %s %s (HTTP %d): %s" % (method, path.split("?")[0], e.code, text))
          call("GET", "/certificates?limit=1")
          print("key: accepted, with access to certificates")
          if call("GET", "/bundleIds?filter[identifier]=%s" % BUNDLE)["data"]:
              print("bundle ID %s: registered" % BUNDLE)
          else:
              call("POST", "/bundleIds", {"data": {"type": "bundleIds", "attributes": {"identifier": BUNDLE, "name": "Cowdrey One", "platform": "IOS"}}})
              print("bundle ID %s: registered now" % BUNDLE)
          if not call("GET", "/apps?filter[bundleId]=%s" % BUNDLE)["data"]:
              sys.exit("No app record for Cowdrey One in App Store Connect yet. Create it: App Store Connect, Apps, +, New App: "
                       "platform iOS, name Cowdrey One, language English (U.S.), bundle ID %s, SKU cowdrey-one, full access. "
                       "Then run this workflow again (Actions, iPhone app, Run workflow)." % BUNDLE)
          print("app record: found")
          PY

      - name: Create the Xcode project
        if: env.HAS_KEY == 'true'
        working-directory: desktop
        run: |
          set -o pipefail
          npx tauri ios init --ci
          # Full-bleed icon: iOS rounds the corners itself.
          npx tauri icon src-tauri/icons/ios-source.png
          PLIST=$(find src-tauri/gen/apple -name Info.plist -path '*_iOS*' | head -1)
          # Uses only the encryption built into iOS, so no export compliance questions on each upload.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # The apps' own links (URL schemes in catalog.js): iOS lets Cowdrey One ask whether these open, which is
          # the only way an iPhone app can see that another app is installed.
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          i=0
          for s in $(node -e "global.window={};require('../web/catalog.js');console.log(window.CATALOG.apps.filter(a=>a.scheme).map(a=>a.scheme).join(' '))"); do
            /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:$i string $s" "$PLIST"; i=$((i+1))
          done
          echo "Apps Cowdrey One can see on iPhone: $i"; /usr/libexec/PlistBuddy -c "Print :LSApplicationQueriesSchemes" "$PLIST"

      # Each run signs on a fresh machine: Xcode makes an "Apple Development: Created via API" certificate whose
      # private key dies with the machine, and Apple caps how many an account may hold. Revoke only those;
      # Developer ID, Apple Distribution and any certificate with a person's name are never touched.
      - name: Clear earlier builds' throwaway signing certificates
        if: env.HAS_KEY == 'true'
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, time, json, urllib.request, jwt
          tok = jwt.encode({"iss": os.environ["APPLE_API_ISSUER"].strip(), "iat": int(time.time()), "exp": int(time.time()) + 600,
                            "aud": "appstoreconnect-v1"}, os.environ["P8"].replace("\r", "").strip(), algorithm="ES256",
                           headers={"kid": os.environ["APPLE_API_KEY"].strip(), "typ": "JWT"})
          def call(method, path):
              req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1" + path, method=method, headers={"Authorization": "Bearer " + tok})
              with urllib.request.urlopen(req) as r:
                  raw = r.read()
                  return json.loads(raw) if raw else {}
          for c in call("GET", "/certificates?limit=200&fields[certificates]=name,displayName,certificateType")["data"]:
              a = c["attributes"]; name = a.get("name") or a.get("displayName") or ""
              if a.get("certificateType") in ("DEVELOPMENT", "IOS_DEVELOPMENT") and "Created via API" in name:
                  call("DELETE", "/certificates/" + c["id"]); print("Revoked throwaway certificate:", name)
          PY

      - name: Build, sign and upload to TestFlight
        if: env.HAS_KEY == 'true'
        working-directory: desktop
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          printf '%s\n' "$P8" > "$KEY"
          export APPLE_API_KEY_PATH="$KEY"
          npx tauri ios build --export-method app-store-connect --build-number ${{ github.run_number }}
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          cp "$IPA" "$RUNNER_TEMP/CowdreyOne.ipa"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: CowdreyOne-iOS
          path: ${{ runner.temp }}/CowdreyOne.ipa
          if-no-files-found: ignore
