[package]
name = "tauri-plugin-installer"
version = "1.0.0"
description = "Cowdrey One's installer on iPhone, iPad and Android: installs Bradley Cowdrey's apps and finds which are installed"
authors = ["Bradley Cowdrey"]
edition = "2021"
publish = false
license = "MIT"
links = "tauri-plugin-installer"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
